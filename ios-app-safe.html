<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Class: Unknown | iOS Safe</title>
  <style>
    :root {
      --bg: #040713;
      --panel: #091021;
      --panel2: #0d1730;
      --ink: #edf8ff;
      --muted: #8da5bd;
      --line: rgba(129, 221, 255, 0.22);
      --system: #67d8ff;
      --government: #67d8ff;
      --personal: #c59cff;
      --accent: var(--system);
      --warning: #ffe45c;
      --danger: #ff708f;
      --ok: #7fffb7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 12% 0, rgba(103,216,255,0.10), transparent 27%),
        radial-gradient(circle at 92% 8%, rgba(197,156,255,0.10), transparent 26%),
        var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 48px;
      height: 32px;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 8px;
      overflow: hidden;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
    }

    .app {
      min-height: 100vh;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .panel {
      background: rgba(9,16,33,0.96);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 24px rgba(0,0,0,0.25);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      display: inline-block;
      box-shadow: 0 0 10px var(--ok);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    .tab {
      border: 1px solid var(--line);
      background: #071025;
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      border-color: var(--accent);
      background: rgba(103, 216, 255, 0.13);
    }

    .sheet {
      background: linear-gradient(transparent 31px, rgba(255,255,255,0.022) 32px),
                  linear-gradient(90deg, transparent 31px, rgba(255,255,255,0.022) 32px),
                  linear-gradient(145deg, rgba(255,255,255,0.03), transparent 35%),
                  #060b18;
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 0 28px rgba(103,216,255,0.15), inset 0 0 70px rgba(0,0,0,0.35);
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(103,216,255,0.38);
    }

    .sheet-title {
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(103,216,255,0.48);
    }

    .sheet-sub {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .card {
      grid-column: span 6;
      border: 1px solid rgba(103,216,255,0.30);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.027), rgba(255,255,255,0.01));
    }

    .card.wide { grid-column: span 12; }
    .card.narrow { grid-column: span 4; }

    .card h3 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(140px, 0.75fr) 1.35fr;
      gap: 9px;
      align-items: start;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .field-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 2px;
    }

    .field-value {
      min-height: 1.3em;
      border-radius: 4px;
      font-weight: 620;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
    }

    .field-value[contenteditable="true"]:focus {
      background: rgba(255,255,255,0.06);
      box-shadow: inset 0 -1px 0 var(--accent);
    }

    .color-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .color-box {
      background: #071025;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px;
    }

    .color-box label {
      display: block;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .color-box input {
      width: 100%;
      height: 32px;
      border: 0;
      background: transparent;
    }

    .ghost-btn,
    .primary-btn,
    .danger-btn {
      border: 1px solid var(--line);
      background: #0b1530;
      color: var(--ink);
      border-radius: 9px;
      padding: 9px 10px;
      cursor: pointer;
      font-weight: 750;
    }

    .primary-btn {
      background: rgba(103, 216, 255, 0.16);
      border-color: var(--accent);
    }

    .danger-btn {
      border-color: rgba(255,112,143,0.35);
      color: #ff9eb3;
    }

    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card { grid-column: span 1; }
      .card.wide, .card.narrow { grid-column: span 1; }
      .field-row {
        grid-template-columns: 1fr;
      }
      .color-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="topbar">
        <div class="brand">Class: Unknown</div>
        <div class="badge"><span class="sync-dot"></span> Local</div>
      </div>

      <div class="tabs">
        <button class="tab active">World System</button>
        <button class="tab">Government Authority</button>
        <button class="tab">Personal Profile</button>
      </div>

      <div class="sheet">
        <div class="sheet-head">
          <div>
            <div class="sheet-title">No Character Selected</div>
            <div class="sheet-sub">Character Database</div>
          </div>
          <button class="primary-btn">Save Local</button>
        </div>

        <div class="grid">
          <div class="card wide">
            <h3>Basic info</h3>
            <div class="field-row">
              <div class="field-label">Name</div>
              <div class="field-value" contenteditable="true">Unknown</div>
            </div>
            <div class="field-row">
              <div class="field-label">Class</div>
              <div class="field-value" contenteditable="true">System</div>
            </div>
            <div class="field-row">
              <div class="field-label">Status</div>
              <div class="field-value" contenteditable="true">Active</div>
            </div>
          </div>

          <div class="card">
            <h3>Core stats</h3>
            <div class="field-row">
              <div class="field-label">Strength</div>
              <div class="field-value" contenteditable="true">-</div>
            </div>
            <div class="field-row">
              <div class="field-label">Agility</div>
              <div class="field-value" contenteditable="true">-</div>
            </div>
            <div class="field-row">
              <div class="field-label">Intelligence</div>
              <div class="field-value" contenteditable="true">-</div>
            </div>
          </div>

          <div class="card">
            <h3>Theme colors</h3>
            <div class="color-row">
              <div class="color-box">
                <label>System</label>
                <input type="color" value="#67d8ff" aria-label="System color" />
              </div>
              <div class="color-box">
                <label>Government</label>
                <input type="color" value="#67d8ff" aria-label="Government color" />
              </div>
              <div class="color-box">
                <label>Personal</label>
                <input type="color" value="#c59cff" aria-label="Personal color" />
              </div>
            </div>
          </div>

          <div class="card wide">
            <h3>Notes</h3>
            <div class="field-value" contenteditable="true">Create a character to begin.</div>
          </div>
        </div>

        <div class="footer">
          <span>Character Dashboard</span>
          <span>Safari Safe</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const colorInputs = document.querySelectorAll('input[type="color"]');

    colorInputs.forEach((input) => {
      input.addEventListener('input', () => {
        const label = input.parentElement.querySelector('label').textContent.trim().toLowerCase();
        if (label === 'system') root.style.setProperty('--system', input.value);
        if (label === 'government') root.style.setProperty('--government', input.value);
        if (label === 'personal') root.style.setProperty('--personal', input.value);
        root.style.setProperty('--accent', root.style.getPropertyValue('--system'));
      });
    });
  </script>
</body>
</html>
