<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#040713">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Class: Unknown">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Class: Unknown</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #040713; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #app-frame { display: block; width: 100%; height: 100%; border: 0; background: #040713; }
    .offline { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; color: #edf8ff; background: #040713; font: 600 16px system-ui, sans-serif; text-align: center; z-index: 2; }
    .offline.visible { display: grid; }
  </style>
</head>
<body>
  <iframe id="app-frame" title="Class: Unknown character database" src="./IHOPETHISISTHERIGHTONE.html"></iframe>
  <div id="offline" class="offline">The character database could not be loaded. Check your connection and try again.</div>
  <script>
    const frame = document.getElementById('app-frame');
    frame.addEventListener('error', () => document.getElementById('offline').classList.add('visible'));
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
